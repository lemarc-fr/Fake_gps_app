name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer le JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Rendre gradlew exécutable
        run: chmod +x gradlew

      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest --stacktrace

            - name: Préparer le keystore de signature
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::Secret KEYSTORE indisponible (fork ?) : l'APK release sera signé avec la clé de debug."
            exit 0
          fi
          if ! printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks" 2>/dev/null; then
            echo "::error::Le secret KEYSTORE doit contenir le keystore encodé en base64 (base64 -w0 upload-keystore.jks)."
            exit 1
          fi
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Compiler les APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_NAME }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Vérifier la signature de l'APK release
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee signature.txt
          if [ -n "${SIGNING_STORE_FILE:-}" ]; then
            if grep -qi "certificate SHA-256 digest: $EXPECTED_CERT_SHA256" signature.txt; then
              echo "APK signé avec la clé upload attendue."
            else
              echo "::error::L'APK n'est pas signé avec la clé upload attendue ($EXPECTED_CERT_SHA256)."
              exit 1
            fi
          fi
        env:
          # Empreinte (publique) du certificat de la clé « upload ».
          EXPECTED_CERT_SHA256: 9fbc503d367f2c753d739971c04f7f216937702c8605769afcb0e888d667f4b7

      - name: Supprimer le keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"

      - name: Publier l'APK debug
        uses: actions/upload-artifact@v4
        with:
          name: fake-gps-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Publier l'APK release
        uses: actions/upload-artifact@v4
        with:
          name: fake-gps-release
          path: app/build/outputs/apk/release/*.apk

      - name: Créer une release GitHub (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk

      - name: Ajouter l'APK release au dépôt (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/release/app-release.apk apk/fake-gps-release.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/fake-gps-release.apk
          if git diff --cached --quiet; then
            echo "APK inchangé"
            exit 0
          fi
          git commit -m "Met à jour l'APK release (${GITHUB_SHA::7}) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
