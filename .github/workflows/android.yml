name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer le JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Rendre gradlew exécutable
        run: chmod +x gradlew

      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compiler les APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Publier l'APK debug
        uses: actions/upload-artifact@v4
        with:
          name: fake-gps-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Publier l'APK release
        uses: actions/upload-artifact@v4
        with:
          name: fake-gps-release
          path: app/build/outputs/apk/release/*.apk

      - name: Créer une release GitHub (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk

      - name: Ajouter l'APK release au dépôt (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/release/app-release.apk apk/fake-gps-release.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/fake-gps-release.apk
          if git diff --cached --quiet; then
            echo "APK inchangé"
            exit 0
          fi
          git commit -m "Met à jour l'APK release (${GITHUB_SHA::7}) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
